services:
  # ========================================================
  # Expo Live Development Service (LAN Mode - Recommended for Linux)
  # Run: docker compose up expo-dev
  # ========================================================
  expo-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: masterhatch-expo-dev
    network_mode: host
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${REACT_NATIVE_PACKAGER_HOSTNAME:-}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.expo
      - /app/dist
    command: ["npx", "expo", "start", "--host", "lan"]
    stdin_open: true
    tty: true

  # ========================================================
  # Expo Tunnel Service (Works on any Wi-Fi / Mobile Data)
  # Run: docker compose up expo-tunnel
  # ========================================================
  expo-tunnel:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: masterhatch-expo-tunnel
    network_mode: host
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.expo
      - /app/dist
    command: ["npx", "expo", "start", "--tunnel"]
    stdin_open: true
    tty: true

  # ========================================================
  # Production Web Service (Nginx)
  # Run: docker compose up web-prod
  # ========================================================
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production-web
    container_name: masterhatch-web-prod
    ports:
      - "3000:80" # Production Web accessible at http://localhost:3000
    restart: unless-stopped
